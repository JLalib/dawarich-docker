version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dawarich-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dawarich
      POSTGRES_USER: dawarich
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dawarich_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawarich -d dawarich"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dawarich-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  dawarich:
    image: freika/dawarich:latest
    container_name: dawarich
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - RAILS_ENV=production
      - DATABASE_URL=postgresql://dawarich:${POSTGRES_PASSWORD:-dawarich_secure_password}@postgres:5432/dawarich
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - HOSTNAME=${HOSTNAME:-localhost}
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_LOG_TO_STDOUT=true
    ports:
      - "3000:3000"
    volumes:
      - dawarich_storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  dawarich_storage: